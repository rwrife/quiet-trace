name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard format, lint, type, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm audit --audit-level=high
        working-directory: app
      - run: npm run format:check
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm run test:run
        working-directory: app

      - run: npm run test:accessibility
        working-directory: app

      - run: npm run build
        working-directory: app

      - run: npm run check:bundle-size
        working-directory: app

      - run: npm run check:firmware-contract
        working-directory: app

  firmware-host:
    name: Firmware host contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Format, build, and test in pinned host toolchain
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -w /workspace \
            silkeh/clang@sha256:10854c9a1b4b8fa550b7c2261d298d9d078f5b89aebd50e7576d8599419cbbfd \
            bash -euxo pipefail -c '
              clang-format --version | grep -F "version 20.1.8"
              cmake --version | grep -F "cmake version 3.25.1"
              clang++ --version | grep -F "clang version 20.1.8"
              clang-format --dry-run --Werror \
                firmware/components/audio_source/include/quiet_trace/audio_source.hpp \
                firmware/components/domain/aggregate_contract.cpp \
                firmware/components/domain/aggregate_projection.cpp \
                firmware/components/domain/acquisition_pipeline.cpp \
                firmware/components/domain/record_ring.cpp \
                firmware/components/domain/control_plane.cpp \
                firmware/components/domain/include/quiet_trace/aggregate_contract.hpp \
                firmware/components/domain/include/quiet_trace/aggregate_projection.hpp \
                firmware/components/domain/include/quiet_trace/acquisition_pipeline.hpp \
                firmware/components/domain/include/quiet_trace/record_ring.hpp \
                firmware/components/domain/include/quiet_trace/control_plane.hpp \
                firmware/components/target/include/quiet_trace/target.hpp \
                firmware/components/target/target_core.cpp \
                firmware/components/target/target_app.cpp \
                firmware/host_tests/aggregate_contract_test.cpp \
                firmware/host_tests/acquisition_pipeline_test.cpp \
                firmware/host_tests/record_ring_test.cpp \
                firmware/host_tests/control_plane_test.cpp \
                firmware/host_tests/target_projection_test.cpp \
                firmware/host_tests/support/synthetic_sample_source.hpp \
                firmware/host_tests/synthetic_source_test.cpp \
                firmware/main/quiet_trace_main.cpp
              cmake -S firmware/host_tests -B /tmp/quiet-trace-host-tests \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER=clang++
              cmake --build /tmp/quiet-trace-host-tests --parallel
              ctest --test-dir /tmp/quiet-trace-host-tests --output-on-failure
            '

  firmware-target:
    name: ESP-IDF v6.1 ESP32-S3 build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: espressif/idf@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify toolchain and build target scaffold
        working-directory: firmware
        run: |
          /opt/esp/entrypoint.sh bash -lc '
            set -e
            version="$(idf.py --version)"
            echo "$version"
            test "$version" = "ESP-IDF v6.1"
            idf.py set-target esp32s3
            idf.py build
          '

  hardware-static:
    name: Hardware ERC/DRC/BOM static gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KICAD_IMAGE: kicad/kicad@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run ERC, netlist export, DRC, and BOM export in the pinned KiCad image
        run: |
          mkdir -p ci-scratch
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp/qt-home \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            --entrypoint bash \
            "$KICAD_IMAGE" -c '
              set -euo pipefail
              # Generate project-local library tables with absolute URIs into the
              # image's packaged libraries. Deterministic across KiCad images
              # (no ${KICAD*_DIR} env-var or HOME-template resolution needed);
              # the generated tables are gitignored and not committed to the
              # hardware sources.
              mkdir -p ci-scratch
              for f in /usr/share/kicad/symbols/*.kicad_sym; do
                b=$(basename "$f" .kicad_sym)
                printf '  (lib (name "%s")(type "KiCad")(uri "%s")(options "")(descr "system library %s"))\n' "$b" "$f" "$b"
              done > ci-scratch/sym-lib-table.body
              printf '(sym_lib_table\n%s)\n' "$(cat ci-scratch/sym-lib-table.body)" > hardware/kicad/sym-lib-table
              for d in /usr/share/kicad/footprints/*.pretty; do
                b=$(basename "$d" .pretty)
                printf '  (lib (name %s)(type KiCad)(uri %s)(options "")(descr "system footprint library %s"))\n' "$b" "$d" "$b"
              done > ci-scratch/fp-lib-table.body
              printf '(fp_lib_table\n%s)\n' "$(cat ci-scratch/fp-lib-table.body)" > hardware/kicad/fp-lib-table
              kicad-cli version
              kicad-cli sch erc --exit-code-violations \
                --severity-error --severity-warning --format report \
                -o /work/ci-scratch/erc.rpt hardware/kicad/quiet-trace.kicad_sch
              kicad-cli sch export netlist --format kicadxml \
                -o /work/ci-scratch/quiet-trace.xml hardware/kicad/quiet-trace.kicad_sch
              kicad-cli sch export netlist --format kicadsexpr \
                -o /work/ci-scratch/quiet-trace.net hardware/kicad/quiet-trace.kicad_sch
              # DRC is expected to exit non-zero while the documented revision-A
              # exceptions are open; the baseline gate below is the arbiter.
              kicad-cli pcb drc --exit-code-violations \
                --severity-error --severity-warning --format report \
                -o /work/ci-scratch/drc.rpt hardware/kicad/quiet-trace.kicad_pcb || true
              python3 hardware/kicad/export_bom.py \
                /work/ci-scratch/quiet-trace.xml /work/ci-scratch/bom.csv
            '
      - name: Netlist connectivity verification (stdlib)
        run: python3 hardware/kicad/verify_netlist.py ci-scratch/quiet-trace.xml
      - name: PCB pad/net cross-check (stdlib)
        run: python3 hardware/kicad/verify_pcb.py ci-scratch/quiet-trace.xml hardware/kicad/quiet-trace.kicad_pcb
      - name: DRC exception baseline gate (stdlib)
        run: python3 hardware/kicad/verify_drc_baseline.py ci-scratch/drc.rpt hardware/kicad/drc-exceptions-baseline.json
      - name: BOM reproducibility against tracked bom/bom.csv
        run: cmp -s ci-scratch/bom.csv bom/bom.csv || { echo "bom/bom.csv differs from schematic export:"; diff ci-scratch/bom.csv bom/bom.csv; exit 1; }
      - name: Show ERC/DRC reports on failure
        if: failure()
        run: cat ci-scratch/erc.rpt ci-scratch/drc.rpt 2>/dev/null || true
